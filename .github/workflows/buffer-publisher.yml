name: Buffer Publisher

on:
  workflow_dispatch:
  schedule:
    # 23:10 UTC = 06:10 Vietnam time (UTC+7), runs daily.
    # Script only adds one post when the Buffer queue has room.
    - cron: '10 23 * * *'

permissions:
  contents: write

jobs:
  queue-next-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add next post to Buffer queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MAX_BUFFER_QUEUE: '6'
        run: node scripts/buffer-publisher.mjs

      - name: Save queue state
        run: |
          if git diff --quiet; then
            echo "No queue changes."
            exit 0
          fi
          git config user.name "AI Marketing Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/queue.json
          git commit -m "chore: queue next Buffer post"
          git push
